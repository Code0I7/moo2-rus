# In-game label formats for the Russian build.
# format <label> <property> = <value>;   properties: template style align x y
#
# This file is the UTF-8 source; install.py writes it to
# 150\mods\rus\cfg\EXTRA.CFG in CP1251, the code page of the game fonts.
# It lives in a subfolder because the Launcher treats every *.CFG directly
# inside a mod folder as a mod of its own.

  format mod_name  = "Русская версия" 1 r 590 400;
  format version   template = "Версия: $VERSION$";
  format leader_xp template = "$XP$/$NEXTLVL$ ОО";
  format prod      template = "$TURNS$ х";
  format prod2     template = "$TOTAL_PROD$ пр / $PRODUCT_COST$";

# END
