# Test-only DOSBox config used by tools/run.ps1.
# output=surface makes SDL take mouse input from the window message queue, so
# the automation can click without stealing focus (ddraw uses DirectInput and
# ignores posted messages). DOSBox only honours the [autoexec] of the last
# config on the command line, so it is repeated here.  run.ps1 starts DOSBox
# in the game folder, so "." is the game.

[sdl]
output=surface
autolock=false

[render]
scaler=normal2x forced

[autoexec]
mount C .
C:
ORION150.EXE /skipintro
exit
