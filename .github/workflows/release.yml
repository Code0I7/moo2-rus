# Builds the player installer and drafts a release.
#
#   git tag v0.9.0-beta && git push origin v0.9.0-beta   -> draft release with the zip
#   Actions -> Release -> Run workflow                   -> zip as a build artifact only
#
# The zip holds moo2-rus.exe (make.py packed by PyInstaller), tr/ and cfg/ -
# no game files.  The exe builds the translation from the user's own copy.name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build moo2-rus.exe
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pyinstaller --onefile --console --name moo2-rus --paths tools make.py

      - name: Package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $pkg = 'pkg/moo2-rus'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item dist/moo2-rus.exe $pkg
          Copy-Item -Recurse tr, cfg $pkg
          Copy-Item README.md, README-en.md, LICENSE $pkg
          Compress-Archive -Path $pkg -DestinationPath "moo2-rus-$ver.zip"
          "ZIP=moo2-rus-$ver.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: moo2-rus
          path: ${{ env.ZIP }}

      # GitHub shows a sha256 digest next to every release asset by itself
      - name: Draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME $env:ZIP --draft --prerelease
          --title "moo2-rus $env:GITHUB_REF_NAME" --notes-file docs/CHANGELOG.md
